# The web build's host: a Cloudflare Worker that serves static files and runs no code of its own.
#
# A Worker rather than a Pages project because wrangler 4.144 no longer creates Pages projects —
# `wrangler pages project create` hands itself to Workers and fails without this file (measured
# 2026-09-29).
#
# `npm run build:web` fills the directory below, and `npx wrangler deploy` publishes it.
name = "coh-sidekick-rebuild"
compatibility_date = "2026-09-29"

# The public site, and the address it used to be tested on. coh-sidekick.com was the React beta
# on GitHub Pages until 1.0.0 (docs/apex-cutover.md). `custom_domain` makes Cloudflare create
# and own each DNS record and certificate on deploy, which it refuses to do over a record it did
# not create: the apex's GitHub Pages records have to be deleted first.
#
# next.coh-sidekick.com stays on this Worker rather than becoming a redirect rule, because the
# page itself does the redirect: index.html, served there, first hands that browser's storage to
# the apex (public/handoff.html). A redirect rule would answer before the page could.
routes = [
  { pattern = "coh-sidekick.com", custom_domain = true },
  { pattern = "next.coh-sidekick.com", custom_domain = true },
]

[assets]
directory = "target/dx/Sidekick/release/web/public"
# Any path that is not a file answers with index.html, so a reload on a deep link, or a sign-in
# redirect carrying a fragment, lands in the app rather than on a Cloudflare 404.
not_found_handling = "single-page-application"
