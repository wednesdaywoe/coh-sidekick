/* Layout: one phone-width column; fixed chrome on top (who, key numbers, the three jobs),
   one scrolling list, sheets that slide up under the key numbers so they stay in view. */
:root {
  color-scheme: dark;
  --metal-0: #111827;
  --metal-1: #1f2937;
  --metal-2: #374151;
  --metal-3: #4b5563;
  --line: #374151;
  --line-2: #4b5563;
  --ink: #f3f4f6;
  --ink-dim: #b5bdc9;
  --ink-faint: #8a92a1;
  --arc: #60a5fa;
  --arc-core: #93c5fd;
  --arc-wash: rgba(96, 165, 250, 0.14);
  --heat: #fbbf24;
  --ember: #ef4444;
  --ok: #4ade80;
  --brand: #d62bce;
  --stat-defense: #c084fc;
  --stat-resistance: #fb923c;
  --stat-special: #fbbf24;
  --stat-heal: #4ade80;
  --tier-uncommon: #facc15;
  --tier-rare: #fb923c;
  --tier-purple: #c084fc;
  --shadow: 0 -10px 30px rgba(0, 0, 0, 0.45);
  --font: 'SN Pro', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 8px;
  --ease: 180ms cubic-bezier(0.4, 0.1, 0.3, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --metal-0: #e5e7eb; --metal-1: #f3f4f6; --metal-2: #ffffff; --metal-3: #e9ebef;
    --line: #d1d5db; --line-2: #b6bcc6;
    --ink: #111827; --ink-dim: #4b5563; --ink-faint: #6b7280;
    --arc: #2563eb; --arc-core: #1d4ed8; --arc-wash: rgba(37, 99, 235, 0.10);
    --heat: #a04606; --ember: #c81e1e; --ok: #146c36; --brand: #b81fb0;
    --stat-defense: #8b2fd9; --stat-resistance: #b03a0b; --stat-special: #a04606; --stat-heal: #146c36;
    --tier-uncommon: #855800; --tier-rare: #b03a0b; --tier-purple: #8b2fd9;
    --shadow: 0 -8px 24px rgba(17, 24, 39, 0.16);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --metal-0: #e5e7eb; --metal-1: #f3f4f6; --metal-2: #ffffff; --metal-3: #e9ebef;
  --line: #d1d5db; --line-2: #b6bcc6;
  --ink: #111827; --ink-dim: #4b5563; --ink-faint: #6b7280;
  --arc: #2563eb; --arc-core: #1d4ed8; --arc-wash: rgba(37, 99, 235, 0.10);
  --heat: #a04606; --ember: #c81e1e; --ok: #146c36; --brand: #b81fb0;
  --stat-defense: #8b2fd9; --stat-resistance: #b03a0b; --stat-special: #a04606; --stat-heal: #146c36;
  --tier-uncommon: #855800; --tier-rare: #b03a0b; --tier-purple: #8b2fd9;
  --shadow: 0 -8px 24px rgba(17, 24, 39, 0.16);
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--metal-0);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--arc); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  position: relative;
  max-width: 440px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--metal-0);
  overflow: hidden;
}
@media (min-width: 480px) {
  .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

/* ---------- chrome ---------- */
.top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 8px 16px;

function bonusTotals(st) {
  const seen = {}; const totals = {}; const rows = [];
  for (const pick of st.picks) {
    if (!pick.power) continue;
    const count = {};
    for (const s of pick.slots) if (s) count[s.set] = (count[s.set] || 0) + 1;
    for (const [setName, n] of Object.entries(count)) {
      const set = SET_BY_NAME[setName];
      set.bonuses.forEach((b, i) => {
        if (b.n > n) return;
        const key = setName + '#' + i;
        seen[key] = (seen[key] || 0) + 1;
        const capped = seen[key] > 5;
        rows.push({ set: setName, power: pick.power.name, n: b.n, fx: b.fx, capped });
        if (capped) return;
        for (const e of b.fx) totals[e.stat] = (totals[e.stat] || 0) + e.v;
      });
    }
  }
  return { totals, rows };
}
function stripValue(def, totals) {
  const add = totals[def.stat] || 0;
  if (def.kind === 'hp') return def.base * (1 + add / 100);
  return def.base + add;
}
function fmt(def, v) {
  if (def.kind === 'hp') return Math.round(v).toLocaleString();
  if (def.kind === 'plus') return '+' + v.toFixed(0) + '%';
  return v.toFixed(1) + '%';
}
function fmtDelta(def, d) {
  if (def.kind === 'hp') return (d > 0 ? '+' : '') + Math.round(d);
  return (d > 0 ? '+' : '') + d.toFixed(def.kind === 'plus' ? 0 : 2);
}

  put(0, 'pri', 'Dark Embrace', slotsOf('Unbreakable Guard', [0, 1, 2, 3]));
  put(1, 'sec', 'Smite', slotsOf('Touch of Death', [0, 1, 2, 3]));
  put(2, 'pri', 'Death Shroud', slotsOf('Obliteration', [0, 1, 2, 3, 4]));
  put(3, 'sec', 'Shadow Maul', slotsOf("Scirocco's Dervish", [0, 1, 2, 3]));
  put(4, 'pri', 'Obsidian Shield', slotsOf('Aegis', [0, 1, 2], 1));
  put(5, 'pri', 'Dark Regeneration', slotsOf('Theft of Essence', [0, 1, 2, 3, 4, 5]));
  put(6, 'pri', 'Murky Cloud', [null]);
  put(7, 'pri', 'Cloak of Darkness', slotsOf('Luck of the Gambler', [0], 1));
  return { picks };
}
function emptyState() { return { picks: PICK_LEVELS.map((lvl) => ({ lvl, power: null, slots: [] })) }; }

let state = exampleState();
let undoStack = [];
const ui = { tab: 'build', job: 'powers', hint: true, sheet: null, filter: 'all', openPools: {}, preview: null };

function mutate(label, fn) {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 50) undoStack.shift();
  const before = bonusTotals(state).totals;
  fn();
  const after = bonusTotals(state).totals;
  render();
  flashChanged(before, after);
  if (label) toast(label);
}
function undo() {
  if (!undoStack.length) return;
  const before = bonusTotals(state).totals;
  state = JSON.parse(undoStack.pop());
  render();
  flashChanged(before, bonusTotals(state).totals);
  if (ui.sheet) renderSheet();
  toast('Undone', false);
}

const extraPlaced = () => state.picks.reduce((n, p) => n + Math.max(0, p.slots.length - 1), 0);
const slotsLeft = () => TOTAL_SLOTS - extraPlaced();
const pickedCount = () => state.picks.filter((p) => p.power).length;
const nextEmpty = (from = 0) => {
  for (let i = from; i < state.picks.length; i++) if (!state.picks[i].power) return i;
  for (let i = 0; i < from; i++) if (!state.picks[i].power) return i;
  return -1;
};
const poolsInUse = () => [...new Set(state.picks.filter((p) => p.power && isPool(p.power.src)).map((p) => p.power.src))];
const enhCounts = () => {
  let filled = 0, total = 0;
  for (const p of state.picks) if (p.power) { total += p.slots.length; filled += p.slots.filter(Boolean).length; }
  return { filled, total };
};

// ---------- sheets ----------
function openSheet(s) { ui.sheet = s; renderSheet(); $('sheet').classList.add('open'); }
function closeSheet() {
  ui.sheet = null; ui.preview = null;
  $('sheet').classList.remove('open');

function renderSheet() {
  const s = ui.sheet; if (!s) return;
  $('sheetFoot').hidden = true;
  $('sheetBack').hidden = !(s.kind === 'power' && s.set);
  if (s.kind === 'pick') renderPickSheet(s); else renderPowerSheet(s);
}

function eligible(idx, src, p) {
  const lvl = state.picks[idx].lvl;
  if (minLevel(src, p) > lvl) return { ok: false, why: `Level ${minLevel(src, p)}` };
  const hadIdx = state.picks.findIndex((q, i) => i !== idx && q.power && q.power.src === src && q.power.name === p.n);
  if (hadIdx >= 0) return { ok: false, taken: state.picks[hadIdx].lvl, takenIdx: hadIdx, why: `Taken at ${state.picks[hadIdx].lvl}` };
  if (idx === 0 && src !== 'pri') return { ok: false, why: 'Primary only' };
  if (idx === 1 && src !== 'sec') return { ok: false, why: 'Secondary only' };
  if (isPool(src)) {
    const used = poolsInUse().filter((k) => !(state.picks[idx].power && state.picks[idx].power.src === k && state.picks.filter((q) => q.power && q.power.src === k).length === 1));
    if (!used.includes(src) && used.length >= MAX_POOLS) return { ok: false, why: '4 pools used' };
  }
  return { ok: true };
}

function renderPickSheet(s) {
  const pick = state.picks[s.idx];
  const title = $('sheetTitle');
  title.textContent = `Level ${pick.lvl}`;
  if (s.flash) { title.classList.remove('flash'); void title.offsetWidth; title.classList.add('flash'); s.flash = false; }
  const n = s.idx + 1;
  $('sheetSub').textContent = pick.power
    ? `Change this power · pick ${n} of ${PICK_LEVELS.length}`
    : s.idx < 2 ? `Choose a power · pick ${n} of ${PICK_LEVELS.length} · level 1 takes one from each set` : `Choose a power · pick ${n} of ${PICK_LEVELS.length}`;
  const used = poolsInUse();
  const filters = [['all', 'All'], ['pri', DATA.primary.name], ['sec', DATA.secondary.name], ['pools', 'Pools']];
  let h = `<div class="chips" role="group" aria-label="Show">${filters.map(([k, l]) =>
    `<button class="chip" type="button" data-filter="${k}" aria-pressed="${ui.filter === k}">${esc(l)}</button>`).join('')}</div>`;

  const optRow = (src, p) => {
    const e = eligible(s.idx, src, p);
    const current = pick.power && pick.power.src === src && pick.power.name === p.n;
    if (e.taken) {
      const mv = canMove(s.idx, e.takenIdx);
      const hold = mv.ok
        ? `<span class="opt-hold">${pick.power ? 'Hold to swap' : 'Hold to move here'}</span>`
        : `<span class="opt-hold no">${esc(mv.why)}</span>`;
      return `<button class="opt taken" type="button" data-move="${e.takenIdx}" ${mv.ok ? '' : `data-nomove="${esc(mv.why)}"`}>
        <span class="opt-name"><span class="tick" aria-hidden="true">✓</span>${esc(p.n)}</span>
        <span class="opt-side">Taken at level ${e.taken}${hold}</span>
        <span class="opt-help">${esc(p.help || p.type)}</span></button>`;
    }
    return `<button class="opt ${current ? 'current' : ''}" type="button" ${e.ok ? `data-take="${src}|${esc(p.n)}"` : 'disabled'}>
      <span class="opt-name">${esc(p.n)}</span>
      <span class="opt-side">${current ? '<span class="opt-take">Current</span>' : e.ok ? '<span class="opt-take">Take</span>' : esc(e.why)}</span>
      <span class="opt-help">${esc(p.help || p.type)}</span></button>`;
  };
  const section = (src) => {
    const rows = SOURCES[src].powers.filter((p) => p.lvl > 0)
      .slice().sort((a, b) => minLevel(src, a) - minLevel(src, b))
      .map((p) => optRow(src, p)).join('');
    return rows;
  };
  if (ui.filter === 'all' || ui.filter === 'pri') h += `<div class="group-h">${esc(DATA.primary.name)}<span class="count">primary</span></div>` + section('pri');
  if (ui.filter === 'all' || ui.filter === 'sec') h += `<div class="group-h">${esc(DATA.secondary.name)}<span class="count">secondary</span></div>` + section('sec');
  if (ui.filter === 'all' || ui.filter === 'pools') {
    h += `<div class="group-h">Power pools<span class="count num">${used.length} of ${MAX_POOLS} used</span></div>`;
    if (pick.lvl < POOL_LEVEL) h += `<div class="list-note">Pools open at level ${POOL_LEVEL}.</div>`;
    else for (const k of POOL_KEYS) {
      const inUse = used.includes(k);
      const open = inUse || ui.openPools[k];
      if (!open) {
        h += `<button class="pool-toggle" type="button" data-openpool="${k}"><span>+</span><b>${esc(DATA.pools[k].name)}</b><span>${used.length >= MAX_POOLS ? 'No room' : 'New pool'}</span></button>`;
      } else {
        h += `<div class="group-h" style="padding-top:6px">${esc(DATA.pools[k].name)}<span class="count">${inUse ? 'in your build' : 'new pool'}</span></div>` + section(k);
      }
    }
  }
  $('sheetBody').innerHTML = h;
  if (pick.power) {
    $('sheetFoot').hidden = false;
    $('sheetFoot').innerHTML = `<button class="danger-btn" type="button" id="removePower">Remove ${esc(pick.power.name)}</button>`;
  }
}

function take(src, name) {
  const s = ui.sheet; const idx = s.idx; const lvl = state.picks[idx].lvl;
  const changing = !!state.picks[idx].power;
  mutate(`${name} at level ${lvl}`, () => {
    state.picks[idx].power = { src, name };
    state.picks[idx].slots = changing ? state.picks[idx].slots.map(() => null) : [null];
  });
  if (changing) { closeSheet(); return; }
  const nx = nextEmpty(idx + 1);
  if (nx < 0) { closeSheet(); toast('All 24 powers chosen', true); return; }
  s.idx = nx; s.flash = true; ui.openPools = {};
  renderSheet();
  $('sheetBody').scrollTop = 0;
}

// Moving a taken power to the level being chosen; swaps when that level is filled.
function fitsAt(pw, idx) {
  const p = findPower(pw.src, pw.name); const need = minLevel(pw.src, p);
  if (need > state.picks[idx].lvl) return `Needs level ${need}`;
  if (idx === 0 && pw.src !== 'pri') return 'First level 1 pick is primary';
  if (idx === 1 && pw.src !== 'sec') return 'Second level 1 pick is secondary';
  return null;
}
function canMove(to, from) {
  const a = state.picks[from], b = state.picks[to];
  const why = fitsAt(a.power, to);
  if (why) return { ok: false, why };
  if (b.power && fitsAt(b.power, from)) return { ok: false, why: `${b.power.name} can't go to level ${a.lvl}` };
  return { ok: true };
}
function doMove(from) {
  const s = ui.sheet; const to = s.idx;
  const A = state.picks[from], B = state.picks[to];
  const name = A.power.name;
  const label = B.power ? `Swapped ${name} and ${B.power.name}` : `Moved ${name} from level ${A.lvl} to ${B.lvl}`;
  const swap = !!B.power;
  mutate(label, () => {
    const a = state.picks[from], b = state.picks[to];
    const held = { power: a.power, slots: a.slots };
    a.power = b.power; a.slots = b.power ? b.slots : [];
    b.power = held.power; b.slots = held.slots;
  });
  if (swap) { closeSheet(); return; }
  const nx = nextEmpty(to + 1);
  if (nx < 0) { closeSheet(); return; }
  s.idx = nx; s.flash = true; ui.openPools = {};
  renderSheet();
}

let press = null; let suppressClickUntil = 0;
function cancelPress() { if (!press) return; clearTimeout(press.timer); press.el.classList.remove('pressing'); press = null; }
document.addEventListener('pointerdown', (ev) => {
  const el = ev.target.closest('.opt.taken');
  if (!el || el.dataset.nomove != null) return;
  cancelPress();
  press = { el, x: ev.clientX, y: ev.clientY, timer: setTimeout(() => {
    el.classList.remove('pressing'); press = null;
    suppressClickUntil = Date.now() + 700;
    if (navigator.vibrate) navigator.vibrate(15);
    doMove(+el.dataset.move);
  }, 500) };
  el.classList.add('pressing');
});
document.addEventListener('pointermove', (ev) => {
  if (press && Math.hypot(ev.clientX - press.x, ev.clientY - press.y) > 10) cancelPress();
});
['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, cancelPress));
document.addEventListener('contextmenu', (ev) => { if (ev.target.closest('.opt.taken')) ev.preventDefault(); });

// power sheet: slots and enhancements
function renderPowerSheet(s) {
  const pick = state.picks[s.idx];
  const power = findPower(pick.power.src, pick.power.name);
  const max = power.max || 6;
  if (s.slot == null || s.slot >= pick.slots.length) {
    const e = pick.slots.findIndex((x) => !x); s.slot = e < 0 ? 0 : e;
  }
  $('sheetTitle').textContent = s.set ? s.set : pick.power.name;
  $('sheetSub').textContent = s.set
    ? `${RARITY_LABEL[SET_BY_NAME[s.set].rarity]} · for ${pick.power.name}`
    : `Level ${pick.lvl} · ${setLabel(pick.power.src)} · ${power.help || power.type}`;

  let h = `<div class="slotbar" role="group" aria-label="Slots">`;
  pick.slots.forEach((sl, i) => {
    h += `<button class="bigslot" type="button" data-pickslot="${i}" aria-pressed="${s.slot === i}">${enhCircle(sl)}<small>${sl ? 'piece ' + (sl.piece + 1) : 'empty'}</small></button>`;
  });
  if (pick.slots.length < max) {
    h += `<button class="bigslot addslot" type="button" id="addSlot" ${slotsLeft() <= 0 ? 'disabled' : ''}><span class="enh">+</span><small class="num">${slotsLeft()} left</small></button>`;
  }
  h += `</div>`;
  const sel = pick.slots[s.slot];
  h += `<div class="slot-tools">${sel
    ? `Slot ${s.slot + 1}: ${esc(sel.set)}, ${esc(SET_BY_NAME[sel.set].pieces[sel.piece].name)} <button class="link-btn warn" type="button" id="clearSlot">Empty it</button>`
    : `Slot ${s.slot + 1} is selected. Pick a set, then a piece.`}</div>`;

  if (!s.set) {
    const types = (power.cats || []).filter((t) => DATA.sets.some((x) => x.type === t));
    if (!types.length) h += `<div class="list-note">This power takes no enhancement sets.</div>`;
    for (const t of types) {
      const sets = DATA.sets.filter((x) => x.type === t).sort((a, b) => RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity] || a.name.localeCompare(b.name));
      h += `<div class="group-h">${esc(t)}<span class="count">${sets.length} sets</span></div>`;
      for (const set of sets) {
        const inPower = pick.slots.filter((x) => x && x.set === set.name).length;
        h += `<button class="setrow" type="button" data-set="${esc(set.name)}"><span class="enh ${set.rarity}">${esc(abbr(set.name))}</span>
          <span><span class="set-name">${esc(set.name)}</span><span class="set-meta">${RARITY_LABEL[set.rarity]} · levels ${set.min}–${set.max} · ${set.pieces.length} pieces</span></span>
          ${inPower ? `<span class="set-in num">${inPower} in</span>` : '<span></span>'}</button>`;
      }
    }
  } else {
    const set = SET_BY_NAME[s.set];
    const plan = fillPlan(pick, set);
    ui.preview = plan.state;
    if (plan.count) {
      h += `<button class="fill-btn" type="button" id="fillSet">${plan.replace ? `Use ${set.name} in all ${plan.count} slots` : `Put ${plan.count} ${plan.count === 1 ? 'piece' : 'pieces'} in the empty slots`}</button>
        <div class="fill-note">The numbers at the top show what this would change.</div>`;
    }
    const have = pick.slots.filter((x) => x && x.set === set.name).length;
    const after = plan.state ? plan.state.picks[s.idx].slots.filter((x) => x && x.set === set.name).length : have;
    h += `<div class="group-h">Pieces<span class="count">tap one to put it in slot ${s.slot + 1}</span></div>`;
    set.pieces.forEach((pc, i) => {
      const at = pick.slots.findIndex((x) => x && x.set === set.name && x.piece === i);
      h += `<button class="piece" type="button" data-piece="${i}" ${at >= 0 ? 'disabled' : ''}><span class="piece-n num">${i + 1}</span>
        <span>${esc(pc.name)} ${pc.proc ? '<span class="piece-tag">PROC</span>' : ''}${pc.unique ? ' <span class="piece-tag">UNIQUE</span>' : ''}</span>
        <span class="where">${at >= 0 ? 'in slot ' + (at + 1) : ''}</span></button>`;
    });
    h += `<div class="group-h">Set bonuses<span class="count num">${have} slotted</span></div>`;
    for (const b of set.bonuses) {
      const cls = b.n <= have ? 'have' : b.n <= after ? 'gain' : '';
      const tag = cls === 'have' ? '<span class="tag">YOU HAVE THIS</span>' : cls === 'gain' ? '<span class="tag">IF YOU FILL</span>' : '';
      h += `<div class="bonus ${cls}"><span class="bn num">${b.n}</span><span>${b.fx.map((e) => esc(e.d)).join(', ')}${tag}</span></div>`;
    }
  }
  $('sheetBody').innerHTML = h;
  renderStrip();
}

function fillPlan(pick, set) {
  const empties = pick.slots.map((x, i) => (x ? -1 : i)).filter((i) => i >= 0);
  const used = new Set(pick.slots.filter((x) => x && x.set === set.name).map((x) => x.piece));
  const free = set.pieces.map((_, i) => i).filter((i) => !used.has(i));
  const next = JSON.parse(JSON.stringify(state));
  const slots = next.picks[ui.sheet.idx].slots;
  if (empties.length) {
    const n = Math.min(empties.length, free.length);
    for (let k = 0; k < n; k++) slots[empties[k]] = { set: set.name, piece: free[k] };
    return { count: n, replace: false, state: n ? next : null };
  }
  const n = Math.min(slots.length, set.pieces.length);
  const already = pick.slots.every((x) => x && x.set === set.name);
  if (already) return { count: 0, state: null };
  for (let k = 0; k < slots.length; k++) slots[k] = k < n ? { set: set.name, piece: k } : slots[k];
  return { count: n, replace: true, state: next };
}

// ---------- toast ----------
let toastTimer;
function toast(text, withUndo = true) {
  $('toastText').textContent = text;
  $('toastUndo').hidden = !withUndo || !undoStack.length;
  const t = $('toast'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- events ----------
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  if (Date.now() < suppressClickUntil) return;
  const d = t.dataset;
  if (d.move != null) { toast(d.nomove != null ? d.nomove : 'Hold to move it here', false); return; }
  if (d.tab) { ui.tab = d.tab; render(); $('scroll').scrollTop = 0; return; }
  if (d.job) { ui.job = d.job; render(); $('scroll').scrollTop = 0; return; }
  if (d.stat != null) { if (ui.sheet) return; ui.tab = 'stats'; render(); return; }
  if (t.id === 'hintClose') { ui.hint = false; renderBuild(); return; }
  if (t.id === 'mockpill') { ui.tab = 'menu'; if (ui.sheet) closeSheet(); render(); return; }
  if (t.id === 'undo' || t.id === 'toastUndo') { undo(); $('toast').classList.remove('show'); return; }
  if (t.id === 'mEmpty') { mutate('Started an empty build', () => { state.picks = emptyState().picks; }); ui.tab = 'build'; ui.job = 'powers'; render(); return; }
  if (t.id === 'mExample') { mutate('Loaded the example', () => { state.picks = exampleState().picks; }); ui.tab = 'build'; render(); return; }
  if (d.pick != null || d.ctaPick != null) { ui.filter = 'all'; ui.openPools = {}; openSheet({ kind: 'pick', idx: +(d.pick ?? d.ctaPick) }); return; }
  if (d.power != null) { openSheet({ kind: 'power', idx: +d.power, set: null, slot: null }); return; }
  if (d.slotPlus != null) { const i = +d.slotPlus; mutate(null, () => state.picks[i].slots.push(null)); return; }
  if (d.slotMinus != null) { const i = +d.slotMinus; mutate(null, () => state.picks[i].slots.pop()); return; }
  // sheet
  if (t.id === 'sheetDone') { closeSheet(); return; }
  if (t.id === 'sheetBack') { ui.sheet.set = null; ui.preview = null; renderSheet(); return; }
  if (d.filter) { ui.filter = d.filter; renderSheet(); return; }
  if (d.openpool) { ui.openPools[d.openpool] = true; renderSheet(); return; }
  if (d.take) { const [src, name] = d.take.split('|'); take(src, name.replace(/&amp;/g, '&').replace(/&quot;/g, '"')); return; }
  if (t.id === 'removePower') {
    const i = ui.sheet.idx; const name = state.picks[i].power.name;
    mutate(`Removed ${name}`, () => { state.picks[i].power = null; state.picks[i].slots = []; }); closeSheet(); return;
  }
  if (d.pickslot != null) { ui.sheet.slot = +d.pickslot; renderSheet(); return; }
  if (t.id === 'addSlot') { const i = ui.sheet.idx; mutate(null, () => state.picks[i].slots.push(null)); ui.sheet.slot = state.picks[i].slots.length - 1; renderSheet(); return; }
  if (t.id === 'clearSlot') { const s = ui.sheet; mutate(null, () => { state.picks[s.idx].slots[s.slot] = null; }); renderSheet(); return; }
  if (d.set) { ui.sheet.set = d.set; renderSheet(); $('sheetBody').scrollTop = 0; return; }
  if (t.id === 'fillSet') {
    const s = ui.sheet; const plan = fillPlan(state.picks[s.idx], SET_BY_NAME[s.set]);
    if (plan.state) { const next = plan.state; mutate(`${s.set} placed`, () => { state.picks = next.picks; }); }
    renderSheet(); return;
  }
  if (d.piece != null) {
    const s = ui.sheet; const piece = +d.piece;
    mutate(null, () => { state.picks[s.idx].slots[s.slot] = { set: s.set, piece }; });
    const slots = state.picks[s.idx].slots; const e = slots.findIndex((x) => !x);
    if (e >= 0) s.slot = e;
    renderSheet(); return;
  }
});
window.addEventListener('resize', measure);
render();
</script>
